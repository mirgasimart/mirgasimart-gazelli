<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1f24" />
      <stop offset="100%" stop-color="#08090a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd" />
      <stop offset="35%" stop-color="#e5c158" />
      <stop offset="70%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#8c6d13" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa820a" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#e5c158" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fdf3cd" stop-opacity="0.5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)" stroke="url(#goldStroke)" stroke-width="1.5" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" ry="11" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.25" />

  <!-- Mirgasim Art Geometric "M" & Absheron Geological Crystal Emblem -->
  <g filter="url(#subtleGlow)">
    <!-- Top Apex Diamond / Mineral Star -->
    <polygon points="32,13 36,17.5 32,22 28,17.5" fill="url(#goldGrad)" />

    <!-- Stylized Architectural 'M' Facets -->
    <!-- Left Stela -->
    <polygon points="16,48 22,48 22,25 16,29" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Left Inward Chiseled Diagonal -->
    <polygon points="22,25 25.5,25 32,38 29.5,41" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Right Inward Chiseled Diagonal -->
    <polygon points="42,25 38.5,25 32,38 34.5,41" fill="url(#goldGrad)" opacity="1.0" />
    <!-- Right Stela -->
    <polygon points="48,48 42,48 42,25 48,29" fill="url(#goldGrad)" opacity="0.95" />

    <!-- Bottom Basal Foundation Bar -->
    <rect x="19" y="47" width="26" height="2" rx="1" fill="url(#goldGrad)" opacity="0.75" />
  </g>
</svg>
